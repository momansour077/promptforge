services:
  postgres:
    image: postgres:16-alpine
    container_name: promptforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptforge
      POSTGRES_USER: promptforge
      POSTGRES_PASSWORD: promptforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptforge -d promptforge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - promptforge

  redis:
    image: redis:7-alpine
    container_name: promptforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - promptforge

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: promptforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://promptforge:promptforge@postgres:5432/promptforge?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://frontend
      CORS_ORIGINS: http://localhost:8080,http://frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - promptforge

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: promptforge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8080:80"
    volumes:
      - frontend_cache:/var/cache/nginx
    networks:
      - promptforge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  frontend_cache:

networks:
  promptforge:
    driver: bridge

